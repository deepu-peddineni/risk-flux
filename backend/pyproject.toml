[project]
name = "risk-flux-backend"
version = "1.0.0"
description = "Risk-Flux — FastAPI backend for energy trading risk & technology knowledge hub"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-dotenv==1.0.1",
    "supabase==2.16.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "resend==2.4.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "slowapi==0.1.9",
    "postgrest==1.1.1",
    "storage3==0.12.1",
    "supafunc==0.10.2",
    "email-validator>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
